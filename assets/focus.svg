<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Focus areas: gameplay systems, game UI and experience, 3D asset pipelines, AI-assisted development">
  <defs>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131c34"/>
      <stop offset="1" stop-color="#0d1426"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, system-ui, sans-serif; }
    .card { opacity: 0; animation: in .8s ease-out forwards; }
    .card .frame { stroke-dasharray: 60 940; animation: run 6s linear infinite; }
    .title { fill: #f1f5f9; font-size: 19px; font-weight: 600; }
    .body  { fill: #94a3b8; font-size: 14px; }
    .ico   { fill: none; stroke: url(#stroke); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .spin  { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
    .bob   { animation: bob 3.5s ease-in-out infinite; }
    @keyframes in   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes run  { to { stroke-dashoffset: -1000; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  </style>

  <!-- 1: gameplay systems -->
  <g class="card" style="animation-delay:.1s">
    <rect x="10" y="10" width="480" height="140" rx="14" fill="url(#fill)" stroke="#6366f1" stroke-opacity=".3"/>
    <rect class="frame" x="10" y="10" width="480" height="140" rx="14" fill="none" stroke="url(#stroke)" stroke-width="2" pathLength="1000"/>
    <g transform="translate(34 40)">
      <g class="spin"><circle class="ico" cx="26" cy="26" r="9"/><path class="ico" d="M26 4v8M26 40v8M4 26h8M40 26h8M10.5 10.5l5.7 5.7M35.8 35.8l5.7 5.7M10.5 41.5l5.7-5.7M35.8 16.2l5.7-5.7"/></g>
    </g>
    <text class="title" x="108" y="62">Gameplay Systems</text>
    <text class="body" x="108" y="90">Client/server architecture, progression and state logic</text>
    <text class="body" x="108" y="112">in Luau, written to stay readable and easy to extend.</text>
  </g>

  <!-- 2: game UI -->
  <g class="card" style="animation-delay:.3s">
    <rect x="510" y="10" width="480" height="140" rx="14" fill="url(#fill)" stroke="#6366f1" stroke-opacity=".3"/>
    <rect class="frame" x="510" y="10" width="480" height="140" rx="14" fill="none" stroke="url(#stroke)" stroke-width="2" pathLength="1000" style="animation-delay:-1.5s"/>
    <g transform="translate(534 40)"><g class="bob">
      <rect class="ico" x="4" y="6" width="44" height="40" rx="5"/>
      <path class="ico" d="M4 18h44M18 18v28"/></g>
    </g>
    <text class="title" x="608" y="62">Game UI &amp; Experience</text>
    <text class="body" x="608" y="90">Consistent interfaces with clear hierarchy, legible type</text>
    <text class="body" x="608" y="112">and layouts that hold up on every screen size.</text>
  </g>

  <!-- 3: 3D pipelines -->
  <g class="card" style="animation-delay:.5s">
    <rect x="10" y="170" width="480" height="140" rx="14" fill="url(#fill)" stroke="#6366f1" stroke-opacity=".3"/>
    <rect class="frame" x="10" y="170" width="480" height="140" rx="14" fill="none" stroke="url(#stroke)" stroke-width="2" pathLength="1000" style="animation-delay:-3s"/>
    <g transform="translate(34 200)"><g class="bob" style="animation-delay:-1s">
      <path class="ico" d="M26 4l20 11v22L26 48 6 37V15z"/>
      <path class="ico" d="M6 15l20 11 20-11M26 26v22"/></g>
    </g>
    <text class="title" x="108" y="222">3D Asset Pipelines</text>
    <text class="body" x="108" y="250">Blender modelling and Python automation, exported to</text>
    <text class="body" x="108" y="272">Roblox with consistent scale, naming and texel density.</text>
  </g>

  <!-- 4: AI-assisted development -->
  <g class="card" style="animation-delay:.7s">
    <rect x="510" y="170" width="480" height="140" rx="14" fill="url(#fill)" stroke="#6366f1" stroke-opacity=".3"/>
    <rect class="frame" x="510" y="170" width="480" height="140" rx="14" fill="none" stroke="url(#stroke)" stroke-width="2" pathLength="1000" style="animation-delay:-4.5s"/>
    <g transform="translate(534 200)">
      <g class="spin" style="animation-duration:20s"><path class="ico" d="M26 3l5 17 17 6-17 6-5 17-5-17-17-6 17-6z"/></g>
    </g>
    <text class="title" x="608" y="222">AI-Assisted Development</text>
    <text class="body" x="608" y="250">Directing AI agents through small, verified phases to</text>
    <text class="body" x="608" y="272">prototype quickly without trading away quality.</text>
  </g>
</svg>
