<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 228" width="1000" height="228" role="img" aria-label="Skills and tools">
<defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs>
<style>text{font-family:'Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif}.chip{opacity:0;animation:in .7s ease-out forwards}.lab{fill:#94a3b8;font-size:13px;letter-spacing:2px;font-weight:600}.tx{fill:#e2e8f0;font-size:14px}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.bar{animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}</style>
<rect class="bar" x="0" y="15" width="3" height="26" rx="1.5" fill="url(#cg)" style="animation-delay:-0.0s"/>
